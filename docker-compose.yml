version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: goathides_db
    restart: always
    environment:
      POSTGRES_USER: goathides_admin
      POSTGRES_PASSWORD: SecureGoatPass99!
      POSTGRES_DB: goathides_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: goathides_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://goathides_admin:SecureGoatPass99!@db:5432/goathides_db?schema=public
      - JWT_SECRET=supersecretgoatkey_replace_in_production
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: goathides_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
